# Validação mínima de Pull Request — sem secrets, sem deploy automático
# Roda em todo push para a branch fix/firestore-security e em PRs para main
#
# O que é validado:
#   1. Instalação limpa de dependências (npm ci)
#   2. Verificação de tipos TypeScript (tsc --noEmit)
#   3. Build de produção (vite build)
#   4. Testes de unidade com Vitest (28 testes de lógica pura)
#
# O que NÃO é executado automaticamente:
#   - Testes de regras Firestore (requerem Firebase Emulator — ver npm run test:rules)
#   - Deploy (sem permissão nem secrets de produção neste workflow)
#   - npm audit --audit-level=critical (registrado como risco pendente)
#
# Para habilitar testes de regras no CI, adicione uma etapa separada com:
#   uses: w9jds/firebase-action@master
#   com FIREBASE_TOKEN armazenado como secret do repositório
#   e firebase emulators:exec

name: PR Validation

on:
  push:
    branches:
      - fix/firestore-security
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: TypeScript — verificação de tipos
        run: npm run lint

      - name: Build de produção
        run: npm run build

      - name: Testes de unidade (lógica pura)
        run: npm test

      # Etapa informativa: auditoria de segurança (não bloqueia o build)
      # Remova "continue-on-error: true" depois de resolver as vulnerabilidades conhecidas:
      # - vite 8.3.0-8.3.2 (launch-editor, GHSA-698v / GHSA-r825 / GHSA-587h) — corrigível com npm audit fix
      # - source-map-js 1.0.0-1.2.1 (DoS) — corrigível com npm audit fix
      # - @grpc/grpc-js (transitiva do firebase-admin) — requer firebase@9 para corrigir (breaking change)
      - name: Auditoria de dependências (informativa)
        run: npm audit --audit-level=high
        continue-on-error: true
